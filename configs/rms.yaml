# Eight reward models evaluated in the paper. Hidden dim / model class are
# used by HARVE for the head-editing step; trust_remote_code is needed for
# InternLM2's custom modeling (works with transformers >=5.x via the
# rope_scaling shim in src/utils/rm_loaders.py).
#
# alpha_star is the per-RM "sweet spot" selected by maximizing
# RewardHackBench Overall improvement subject to ΔRM-Bench Hard ≥ −2pp,
# searched over the α grid in configs/harve.yaml::ablation.alphas.

models:
  Skywork-Reward-V2-Qwen3-0.6B:
    hf_id: Skywork/Skywork-Reward-V2-Qwen3-0.6B
    model_class: auto_for_seq_cls
    trust_remote_code: false
    hidden_dim: 1024
    target_categories:
      - A1_made_up_sources
      - A3_citation_density
      - B1_missing_legal_elements
      - C3_confidence_inflation
    alpha_star: 1.25

  internlm2-1_8b-reward:
    hf_id: internlm/internlm2-1_8b-reward
    model_class: auto
    trust_remote_code: true
    hidden_dim: 2048
    target_categories:
      - B1_missing_legal_elements
      - C1_user_aligned_reasoning
      - C2_safety_disclaimer_bias
      - C3_confidence_inflation
    alpha_star: 1.10

  GRM-Llama3.2-3B-rewardmodel-ft:
    hf_id: Ray2333/GRM-Llama3.2-3B-rewardmodel-ft
    model_class: auto_for_seq_cls
    trust_remote_code: false
    hidden_dim: 3072
